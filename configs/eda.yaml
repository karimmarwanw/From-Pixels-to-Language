# Settings for: python -m src.cli eda --config configs/eda.yaml --step N
# The EDA uses the official TRAIN set only. The test set is not loaded until final evaluation.
train_name: Multimodal-Fatima/CUB_train
cache_dir: data/hf_cache          # downloaded dataset (gitignored)
figures_dir: outputs/figures/eda  # every EDA figure: stepNN_*.png

seed: 42
n_inspect: 3                      # step 1: how many full records to print

stats_dir: outputs/eda            # step 3: cached per-image table (image_stats.csv)
rebuild_stats: false              # step 3: true = rescan all images even if the CSV exists
small_side_px: 224                # step 3: "small" = shorter side below the model input size
gray_tolerance: 3                 # step 3: max |R-G|,|G-B|,|R-B| (0-255) still counted as gray (JPEG noise)
n_unusual: 5                      # step 3: images per row in the unusual-images grid
wide_aspect: 2.0                  # step 3: "very wide" = width / height above this
tall_aspect: 0.5                  # step 3: "very tall" = width / height below this (mirror of 2.0)
dark_brightness: 35               # step 3: "very dark" = mean pixel value below this (0-255)
bright_brightness: 220            # step 3: "very bright" = mean pixel value above this (35 from white)

dup_max_distance: 4               # step 4: pHash bits that may differ for a near-duplicate (chosen by eye:
                                  #         all pairs <= 4 were the same photo, all pairs >= 6 were not)
n_lookalikes: 4                   # step 4: closest NON-duplicate pairs to show (justifies the threshold)

n_samples: 16                     # step 5: random images in the sample grid
sample_cols: 4                    # step 5: columns of the sample grid
similar_groups: [Gull, Tern]      # step 5: one row per word; shows every species whose name contains it
caption_wrap: 40                  # step 5: characters per line when drawing captions under images

n_top_words: 30                   # step 6: most frequent words to print / plot
min_freq_options: [1, 2, 3, 5, 10]  # step 6: vocabulary size if words rarer than this are dropped (M2 choice)
stop_words: [a, an, the, this, that, bird, has, have, and, with, is, are, of, its, it, it's, "on", to, in, very, as, at, which]
                                  # step 6: ignored in the "top content words" chart only
                                  # ("on" is quoted: unquoted, YAML reads it as the boolean True)
color_words: [black, white, brown, grey, gray, yellow, red, orange, blue, green, tan, buff, olive, pink, purple, golden, cream, rust]
body_part_words: [wings, wing, belly, breast, head, crown, bill, beak, tail, throat, nape, back, eyering, feet, tarsus, rectrices,
                  primaries, secondaries, superciliary, wingbars, crest, neck, cheek, abdomen, eyebrow, eye, eyes, feathers]
typo_examples: [whtie, bil, beek, retrices, supercillary, witha]  # step 6: typos to SHOW in the problems figure
n_template_examples: 5            # step 6: different birds shown with the same template caption

split_path: data/splits/split.json  # step 7: committed, shared by the whole team
val_size: 0.15                      # step 7: share of the official train set held out for validation

image_size: 224                     # step 8: images are resized to this before measuring (= model input)
stats_path: data/processed/stats.json  # step 8: fitted mean/std, loaded later by training
imagenet_mean: [0.485, 0.456, 0.406]   # step 8: standard ImageNet values used by torchvision pretrained models
imagenet_std: [0.229, 0.224, 0.225]
normalization: imagenet           # DECIDED (option A): both scratch and transfer models use ImageNet mean/std,
                                  # so they get identical inputs and the comparison isolates pretraining.
                                  # Evidence: CUB stats (stats.json) are close to ImageNet's (max mean diff +0.04).
